<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phototagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2.1.1/css/pico.jade.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="start-view" class="view">
  <header id="app-header">
    <svg class="app-mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 3h8l10 10-8 8L3 11z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="7.5" cy="7.5" r="1.75" fill="currentColor"/>
    </svg>
    <div>
      <h1>Phototagger</h1>
      <p>Fix dates, places and keywords, one photo at a time, before importing to Immich.</p>
    </div>
  </header>
  <div id="start-summary">Scanning…</div>
  <fieldset id="mode-select" class="segmented">
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="non-tagged" checked> Non-Tagged <span class="count" id="mode-count-non-tagged">0</span></label>
    <label><input type="radio" name="mode" value="tagged"> Tagged <span class="count" id="mode-count-tagged">0</span></label>
    <label><input type="radio" name="mode" value="all"> All <span class="count" id="mode-count-all">0</span></label>
  </fieldset>
  <fieldset id="geo-select" class="segmented">
    <legend>Geo</legend>
    <label><input type="radio" name="geo" value="all" checked> All <span class="count" id="geo-count-all">0</span></label>
    <label><input type="radio" name="geo" value="missing-gps"> Missing GPS <span class="count" id="geo-count-missing-gps">0</span></label>
  </fieldset>
  <div id="start-actions">
    <button type="button" id="start-button" disabled>Start tagging</button>
    <button type="button" id="manage-keywords-start-button" class="secondary">Manage keywords…</button>
  </div>
</section>

<section id="tag-view" class="view" hidden>
  <header id="tag-header">
    <progress id="tag-progress-bar" value="0" max="1"></progress>
    <span id="tag-progress"></span>
    <span id="tag-relpath"></span>
  </header>

  <div id="tag-error" role="alert" hidden>
    <span id="tag-error-message"></span>
    <button type="button" id="tag-error-dismiss" class="secondary outline small" aria-label="Dismiss">✕</button>
  </div>

  <div id="tag-body">
    <div id="preview-pane">
      <img id="preview-img" alt="current photo preview">
      <p id="photo-facts"></p>
    </div>

    <form id="tag-form">
      <fieldset data-group="location">
        <legend>Location
          <button type="button" class="same-as-prev" data-group="location" title="Same as last (location)" aria-label="Same as last (location)">↩ Same as last</button>
          <button type="button" id="save-located-keyword-toggle" class="outline secondary small legend-end">📍 Save as located keyword…</button>
        </legend>
        <div id="map"></div>
        <div id="save-located-keyword-row" hidden>
          <input type="text" id="located-keyword-name-input" placeholder="Keyword for this place…" aria-label="Located keyword name">
          <button type="button" id="save-located-keyword-button" class="small">Save</button>
        </div>
        <p id="located-keyword-error" class="field-error" role="alert" hidden></p>
      </fieldset>

      <fieldset data-group="dateTime">
        <legend>Date &amp; time
          <button type="button" class="same-as-prev" data-group="dateTime" title="Same as last (date &amp; time)" aria-label="Same as last (date &amp; time)">↩ Same as last</button>
        </legend>
        <input type="datetime-local" id="datetime-input" step="1" aria-label="Date &amp; time">
      </fieldset>

      <fieldset data-group="keywords">
        <legend>Keywords
          <button type="button" class="same-as-prev" data-group="keywords" title="Same as last (keywords)" aria-label="Same as last (keywords)">↩ Same as last</button>
          <button type="button" id="manage-keywords-tag-button" class="outline secondary small legend-end">Manage keywords…</button>
        </legend>
        <div id="keyword-field">
          <span id="keyword-chips"></span>
          <input type="text" id="keyword-entry" placeholder="Add a keyword…" aria-label="Add a keyword"
                 role="combobox" aria-autocomplete="list" aria-controls="keyword-suggestions" aria-expanded="false" autocomplete="off">
        </div>
        <ul id="keyword-suggestions" role="listbox" aria-label="Known keywords" hidden></ul>
        <p id="keyword-status" class="visually-hidden" role="status" aria-live="polite"></p>
      </fieldset>

      <fieldset data-group="caption">
        <legend>Caption
          <button type="button" class="same-as-prev" data-group="caption" title="Same as last (caption)" aria-label="Same as last (caption)">↩ Same as last</button>
        </legend>
        <label><textarea id="caption-input" rows="2"></textarea></label>
      </fieldset>

      <details id="additional-details">
        <summary>Additional <span id="additional-required-badge" hidden>⚠ UTC offset needed</span></summary>
        <label>Altitude (m) <input type="number" step="any" id="altitude-input"></label>
        <label>UTC offset <input type="text" id="offset-input" placeholder="+01:00"></label>
        <span id="offset-status"></span>
      </details>
    </form>
  </div>

  <footer id="tag-controls">
    <button id="prev-button" type="button" class="secondary outline"><kbd>←</kbd> Prev</button>
    <button id="skip-button" type="button" class="secondary outline">Skip <kbd>→</kbd></button>
    <button id="apply-button" type="button">Apply &amp; Next <kbd>⏎</kbd></button>
  </footer>
</section>

<section id="manage-view" class="view" hidden>
  <header id="manage-header">
    <button type="button" id="manage-back-button" class="secondary outline small">← Back</button>
    <h1>Manage keywords</h1>
  </header>
  <dialog id="manage-location-editor">
    <article>
      <header>Location for <strong id="manage-location-keyword"></strong> <span id="manage-location-status"></span></header>
      <p>Click the map to place the pin.</p>
      <div id="manage-location-map"></div>
      <p id="manage-location-error" class="field-error" role="alert" hidden></p>
      <footer class="dialog-actions">
        <button type="button" id="manage-location-cancel-button" class="secondary outline">Cancel</button>
        <button type="button" id="manage-location-clear-button" class="danger outline">Clear</button>
        <button type="button" id="manage-location-save-button">Save</button>
      </footer>
    </article>
  </dialog>
  <ul id="manage-keywords-list"></ul>
</section>

<dialog id="ask-dialog">
  <article>
    <h3 id="ask-title"></h3>
    <p id="ask-message"></p>
    <input type="text" id="ask-input" aria-labelledby="ask-title" hidden>
    <p id="ask-error" class="field-error" role="alert" hidden></p>
    <footer class="dialog-actions">
      <button type="button" id="ask-cancel-button" class="secondary outline">Cancel</button>
      <button type="button" id="ask-confirm-button">OK</button>
    </footer>
  </article>
</dialog>

<section id="done-view" class="view" hidden>
  <h1>All done</h1>
  <p id="done-summary"></p>
  <button type="button" id="done-back-button">Back to start</button>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/formstate.js"></script>
<script src="/app.js"></script>
</body>
</html>
