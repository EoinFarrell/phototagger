<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>phototagger</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@picocss/pico@2.1.1/css/pico.classless.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<section id="start-view" class="view">
  <h1>phototagger</h1>
  <div id="start-summary">Scanning…</div>
  <fieldset id="mode-select">
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="non-tagged" checked> Non-Tagged (<span id="mode-count-non-tagged">0</span>)</label>
    <label><input type="radio" name="mode" value="tagged"> Tagged (<span id="mode-count-tagged">0</span>)</label>
    <label><input type="radio" name="mode" value="all"> All (<span id="mode-count-all">0</span>)</label>
  </fieldset>
  <fieldset id="geo-select">
    <legend>Geo</legend>
    <label><input type="radio" name="geo" value="all" checked> All (<span id="geo-count-all">0</span>)</label>
    <label><input type="radio" name="geo" value="missing-gps"> Missing GPS (<span id="geo-count-missing-gps">0</span>)</label>
  </fieldset>
  <div id="start-actions">
    <button id="start-button" disabled>Start tagging</button>
    <button type="button" id="manage-keywords-start-button">Manage keywords…</button>
  </div>
</section>

<section id="tag-view" class="view" hidden>
  <header id="tag-header">
    <span id="tag-progress"></span>
    <span id="tag-relpath"></span>
  </header>

  <div id="tag-body">
    <div id="preview-pane">
      <img id="preview-img" alt="current photo preview">
    </div>

    <form id="tag-form">
      <fieldset data-group="location">
        <legend>Location
          <button type="button" class="same-as-prev" data-group="location" title="Same as previous (location)" aria-label="Same as previous (location)">↩</button>
        </legend>
        <div id="located-keyword-pills"></div>
        <div id="map"></div>
        <div id="save-located-keyword-row">
          <input type="text" id="located-keyword-name-input" placeholder="Keyword for this place…" aria-label="Located keyword name">
          <button type="button" id="save-located-keyword-button">Save pin as located keyword</button>
        </div>
      </fieldset>

      <fieldset data-group="dateTime">
        <legend>Date &amp; time
          <button type="button" class="same-as-prev" data-group="dateTime" title="Same as previous (date &amp; time)" aria-label="Same as previous (date &amp; time)">↩</button>
        </legend>
        <input type="datetime-local" id="datetime-input" step="1" aria-label="Date &amp; time">
      </fieldset>

      <fieldset data-group="keywords">
        <legend>Keywords
          <button type="button" class="same-as-prev" data-group="keywords" title="Same as previous (keywords)" aria-label="Same as previous (keywords)">↩</button>
        </legend>
        <label>Comma-separated <input type="text" id="keywords-input"></label>
        <div id="keyword-pills"></div>
        <button type="button" id="manage-keywords-tag-button">Manage keywords…</button>
      </fieldset>

      <fieldset data-group="caption">
        <legend>Caption
          <button type="button" class="same-as-prev" data-group="caption" title="Same as previous (caption)" aria-label="Same as previous (caption)">↩</button>
        </legend>
        <label><textarea id="caption-input" rows="2"></textarea></label>
      </fieldset>

      <details id="additional-details">
        <summary>Additional <span id="additional-required-badge" hidden>⚠ UTC offset needed</span></summary>
        <label>Altitude (m) <input type="number" step="any" id="altitude-input"></label>
        <label>UTC offset <input type="text" id="offset-input" placeholder="+01:00"></label>
        <span id="offset-status"></span>
      </details>
    </form>
  </div>

  <footer id="tag-controls">
    <button id="prev-button" type="button">← Prev</button>
    <button id="skip-button" type="button">Skip →</button>
    <button id="apply-button" type="button">Apply &amp; Next ✓</button>
  </footer>
</section>

<section id="manage-view" class="view" hidden>
  <h1>Manage keywords</h1>
  <button type="button" id="manage-back-button">← Back</button>
  <article id="manage-location-editor" hidden>
    <header>Location for <strong id="manage-location-keyword"></strong> <span id="manage-location-status"></span></header>
    <p>Click the map to place the pin.</p>
    <div id="manage-location-map"></div>
    <div id="manage-location-actions">
      <button type="button" id="manage-location-save-button">Save</button>
      <button type="button" id="manage-location-clear-button">Clear</button>
      <button type="button" id="manage-location-cancel-button">Cancel</button>
    </div>
  </article>
  <ul id="manage-keywords-list"></ul>
</section>

<section id="done-view" class="view" hidden>
  <h1>All done</h1>
  <p>Every photo in this run has been Applied.</p>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/formstate.js"></script>
<script src="/app.js"></script>
</body>
</html>
